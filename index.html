<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Campo Minado</title>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e1b4b; --glass:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.12);
    --text:#e2e8f0; --muted:#94a3b8; --accent:#8b5cf6; --accent2:#22d3ee;
    --cell:36px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1200px 700px at 15% 10%,#3b2a8c55,transparent 60%),
               radial-gradient(900px 600px at 90% 90%,#0e749055,transparent 60%),
               linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden;user-select:none;
  }
  button{font-family:inherit}
  .blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.35;z-index:0;animation:float 14s ease-in-out infinite}
  .b1{width:300px;height:300px;background:#7c3aed;top:-80px;left:-60px}
  .b2{width:260px;height:260px;background:#06b6d4;bottom:-80px;right:-40px;animation-delay:-6s}
  @keyframes float{50%{transform:translate(40px,30px) scale(1.15)}}

  .screen{display:none;position:relative;z-index:1;max-width:100%;
    background:var(--glass);border:1px solid var(--stroke);border-radius:24px;padding:20px;
    backdrop-filter:blur(18px);box-shadow:0 30px 80px #0008,inset 0 1px 0 #fff2}
  .screen.active{display:block;animation:appIn .6s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes appIn{from{opacity:0;transform:translateY(30px) scale(.95)}}
  h1{margin:0 0 14px;font-size:22px;letter-spacing:.5px;text-align:center;
     background:linear-gradient(90deg,var(--accent2),var(--accent),#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* ---------- menu ---------- */
  #menu{width:680px;text-align:center}
  #menu h1{font-size:34px;margin-bottom:4px}
  #menu .sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:16px 0 10px}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .mode{
    text-align:left;border:1px solid var(--stroke);background:var(--glass);color:var(--text);border-radius:18px;padding:16px;
    cursor:pointer;transition:.25s;position:relative;overflow:hidden;
    animation:cardIn .6s both cubic-bezier(.2,.9,.3,1.3)}
  .mode:nth-child(2){animation-delay:.08s}.mode:nth-child(3){animation-delay:.16s}
  @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.9)}}
  .mode:hover{transform:translateY(-4px);background:#ffffff12}
  .mode.sel{border-color:var(--accent2);background:linear-gradient(160deg,#8b5cf633,#22d3ee22);
    box-shadow:0 0 0 1px var(--accent2),0 12px 36px #22d3ee33;transform:translateY(-4px)}
  .mode .ic{font-size:34px;display:inline-block;animation:bob 3s ease-in-out infinite}
  .mode:nth-child(2) .ic{animation-delay:-1s}.mode:nth-child(3) .ic{animation-delay:-2s}
  @keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
  .mode b{display:block;font-size:17px;margin:6px 0 4px}
  .mode .d{font-size:12px;line-height:1.4;color:var(--muted);display:block}
  .levels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .lvl{border:1px solid var(--stroke);background:var(--glass);color:var(--text);padding:10px 20px;border-radius:14px;
    font:600 15px inherit;cursor:pointer;transition:.2s}
  .lvl small{display:block;font-weight:400;font-size:11px;color:#cbd5e1;opacity:.8;margin-top:2px}
  .lvl:hover{transform:translateY(-2px);background:#ffffff14}
  .lvl.sel{background:linear-gradient(135deg,var(--accent),#6366f1);border-color:transparent;box-shadow:0 6px 20px #8b5cf666}
  .play{margin-top:24px;border:0;padding:14px 44px;border-radius:16px;font:800 17px inherit;letter-spacing:1px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--accent2),var(--accent),#f472b6);background-size:200% 100%;
    box-shadow:0 10px 30px #8b5cf666;transition:.25s;animation:shine 4s linear infinite}
  @keyframes shine{50%{background-position:100% 0}}
  .play:hover{transform:translateY(-3px) scale(1.05)}
  .play:active{transform:scale(.96)}

  /* ---------- jogo ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .tag{font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;background:#0005;border:1px solid var(--stroke)}
  .tool{border:1px solid var(--stroke);background:var(--glass);color:var(--text);padding:8px 14px;border-radius:12px;
    font:600 14px inherit;cursor:pointer;transition:.2s}
  .tool:hover{transform:translateY(-2px);background:#ffffff14}
  .tool.on{background:linear-gradient(135deg,#f59e0b,#ef4444);border-color:transparent}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .stat{min-width:88px;padding:8px 12px;border-radius:12px;background:#0006;border:1px solid var(--stroke);
    font:700 22px/1 "Courier New",monospace;color:var(--accent2);text-align:center;text-shadow:0 0 12px #22d3ee88}
  .stat span{font-size:16px;margin-right:4px}
  #face{width:52px;height:52px;border-radius:16px;font-size:28px;border:1px solid var(--stroke);background:var(--glass);cursor:pointer;transition:.25s}
  #face:hover{transform:rotate(-8deg) scale(1.1)}
  #face:active{transform:scale(.9)}
  .boardwrap{overflow:auto;max-width:calc(100vw - 72px);max-height:62vh;padding:6px;border-radius:16px;background:#0004}
  #board{display:grid;gap:3px;width:max-content;margin:0 auto;position:relative}
  .cell{
    width:var(--cell);height:var(--cell);border-radius:8px;display:flex;align-items:center;justify-content:center;
    font:800 calc(var(--cell)*.52) inherit;cursor:pointer;position:relative;
    background:linear-gradient(145deg,#4c4f8f,#33366b);box-shadow:0 3px 0 #1b1d44,inset 0 1px 0 #fff3;
    transition:transform .12s,filter .12s;
  }
  .cell.long{font-size:calc(var(--cell)*.4)}
  .cell.spawn{animation:spawn .45s both cubic-bezier(.2,.9,.3,1.4)}
  @keyframes spawn{from{opacity:0;transform:scale(.2) rotate(-25deg)}}
  .cell:not(.open):hover{filter:brightness(1.3);transform:translateY(-2px)}
  .cell:not(.open):active{transform:translateY(1px) scale(.93)}
  .cell.open{background:#0f1330;box-shadow:inset 0 2px 6px #000a;cursor:default;animation:reveal .35s both}
  @keyframes reveal{0%{transform:scale(.6) rotateX(90deg);filter:brightness(2)}60%{transform:scale(1.08)}100%{transform:none;filter:none}}
  .n0{color:#a5b4fc}
  .n1{color:#60a5fa}.n2{color:#4ade80}.n3{color:#f87171}.n4{color:#c084fc}
  .n5{color:#fb923c}.n6{color:#22d3ee}.n7{color:#f472b6}.n8{color:#e2e8f0}
  .cell.open[class*=" n"]{text-shadow:0 0 10px currentColor}
  .cell.open.neg{box-shadow:inset 0 2px 6px #000a,inset 0 0 0 1.5px #38bdf877}
  .cell.open.neg::before{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(145deg,#0ea5e922,transparent)}
  .flag{animation:flagpop .4s cubic-bezier(.2,1.6,.4,1) backwards;display:inline-block}
  .flag.neg{filter:hue-rotate(180deg) saturate(1.4) drop-shadow(0 0 6px #38bdf8)}
  @keyframes flagpop{from{transform:scale(0) translateY(-14px) rotate(-40deg)}}
  .stack{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;line-height:1.05;pointer-events:none}
  .stack.s2{font-size:calc(var(--cell)*.4)}
  .stack.s3{font-size:calc(var(--cell)*.34);width:calc(var(--cell)*.92)}
  #board.shapes .stack.s2{font-size:calc(var(--cell)*.34)}
  #board.shapes .stack.s3{font-size:calc(var(--cell)*.3);width:calc(var(--cell)*.82)}
  .badge{position:absolute;right:2px;bottom:1px;font:800 calc(var(--cell)*.3)/1 inherit;font-style:normal;
    background:#000a;color:#fff;border-radius:6px;padding:2px 3px;animation:flagpop .3s}
  .badge.neg{color:#38bdf8;font-size:calc(var(--cell)*.38)}
  .cell.flagged{background:linear-gradient(145deg,#7c3aed,#5b21b6)}
  .cell.negflag{background:linear-gradient(145deg,#0284c7,#1e3a8a)}
  .cell.mine{background:#3a0d1c;animation:boom .5s both}
  .cell.negmine{background:#0c2a4a}
  .cell.negmine .stack>span{filter:invert(1) drop-shadow(0 0 4px #38bdf8)}
  .cell.boom{background:radial-gradient(circle,#ef4444,#7f1d1d)!important;z-index:2}
  @keyframes boom{0%{transform:scale(.5);filter:brightness(3)}50%{transform:scale(1.35)}100%{transform:none}}
  .cell.wrong{background:#4b1d1d;opacity:.8}
  .cell.wrong::after{content:"✖";position:absolute;color:#f87171;font-size:14px;right:3px;top:0}
  #board.shapes{display:block;position:relative;background:#05071acc;border-radius:14px}
  #board.shapes .cell{position:absolute;border-radius:0;box-shadow:none}
  #board.shapes .cell:not(.open):hover{transform:scale(1.05);z-index:3}
  #board.shapes .cell.open{background:#161b4d;box-shadow:none}
  #board.shapes .cell.open.neg{background:#0b2a4d}
  #board.shapes .cell.negmine{background:#0c2a4a}
  #board.shapes .cell.mine:not(.negmine){background:#3a0d1c}
  #board.shapes .cell.boom{z-index:4}
  #board.shapes .badge{right:auto;bottom:auto;left:calc(50% + var(--cell)*.1);top:calc(50% + var(--cell)*.08)}
  #board.shapes .cell.wrong::after{right:auto;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;opacity:.9}
  #board.shake{animation:shake .5s}
  @keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,-2px)}}
  #board.win .cell{animation:wave .8s both}
  @keyframes wave{50%{transform:translateY(-10px) scale(1.12);filter:brightness(1.6)}}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;font-size:12px;color:var(--muted)}
  .best{font-weight:600;color:var(--text)}
  #help{justify-content:center;text-align:center;line-height:1.5}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020617aa;backdrop-filter:blur(4px);
    z-index:5;opacity:0;pointer-events:none;transition:.4s}
  #overlay.show{opacity:1;pointer-events:auto}
  .modal{background:linear-gradient(160deg,#1e1b4bee,#0f172aee);border:1px solid var(--stroke);border-radius:24px;padding:28px 36px;text-align:center;
    transform:scale(.6) translateY(40px);transition:.5s cubic-bezier(.2,1.4,.4,1)}
  #overlay.show .modal{transform:none}
  .modal .big{font-size:56px;animation:bounce 1s infinite}
  @keyframes bounce{50%{transform:translateY(-10px)}}
  .modal h2{margin:6px 0}.modal p{color:var(--muted);margin:4px 0 18px}
  .modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .modal button{border:0;padding:12px 22px;border-radius:14px;font:700 15px inherit;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#6366f1);box-shadow:0 8px 24px #8b5cf666;transition:.2s}
  .modal button.alt{background:#ffffff18;box-shadow:none}
  .modal button:hover{transform:translateY(-2px) scale(1.04)}
  .qm{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:800 12px/1 inherit;
    background:#ffffff1f;border:1px solid var(--stroke);color:var(--text);cursor:help;transition:.2s;flex:none}
  .qm:hover{background:var(--accent);transform:scale(1.2) rotate(8deg);border-color:transparent}
  .mode .qm{position:absolute;top:10px;right:10px;z-index:2}
  .lvl .qm{margin-left:8px;vertical-align:middle}
  .mode.mixing::before{content:"☐";position:absolute;top:10px;left:12px;font-size:18px;color:var(--muted)}
  .mode.mixing.sel::before{content:"☑";color:var(--accent2)}
  .mode.mixing .ic{margin-left:22px}
  .labelrow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
  .mixsw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:14px;font-weight:700;color:var(--text)}
  .mixsw input{display:none}
  .mixsw .sw{width:42px;height:24px;border-radius:999px;background:#ffffff22;border:1px solid var(--stroke);position:relative;transition:.25s}
  .mixsw .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s}
  .mixsw input:checked+.sw{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .mixsw input:checked+.sw::after{transform:translateX(18px)}
  #mixHint{min-height:16px;font-size:12px;color:var(--accent2);margin:6px 0 -4px}
  .duelbar{display:flex;gap:10px;margin-bottom:12px}
  .duelbar[hidden]{display:none}
  .duelbar .pl{flex:1;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:#0005;border:1px solid var(--stroke);font-weight:700;font-size:13px;opacity:.55;transition:.3s}
  .duelbar .pl b{font:800 20px "Courier New",monospace}
  .duelbar .pl.on{opacity:1;transform:scale(1.04)}
  #p0.on{border-color:#3b82f6;box-shadow:0 0 18px #3b82f699}
  #p1.on{border-color:#f97316;box-shadow:0 0 18px #f9731699}
  #game.duel[data-turn="0"] .boardwrap{box-shadow:0 0 0 2px #3b82f6aa}
  #game.duel[data-turn="1"] .boardwrap{box-shadow:0 0 0 2px #f97316aa}
  #board .cell.open.op0{background:#102a63}
  #board .cell.open.op1{background:#5a2a0c}
  .tool[hidden]{display:none}
  .tool:disabled{opacity:.4;cursor:not-allowed}
  #board.radar .cell{cursor:crosshair}
  .cell.scan::after{content:"";position:absolute;inset:0;background:#22d3ee;opacity:0;pointer-events:none;animation:scanflash .9s var(--sd,0ms) both}
  @keyframes scanflash{0%{opacity:0}30%{opacity:.7}100%{opacity:0}}
  .rmark{position:absolute;z-index:6;transform:translate(-50%,-50%);background:#0e7490;color:#fff;font:800 11px/1 inherit;padding:3px 6px;border-radius:8px;
    pointer-events:none;animation:flagpop .4s;box-shadow:0 2px 8px #0008;white-space:nowrap}
  .rmark.neg{background:#1d4ed8}
  .hp{color:#c084fc}.hge{color:#4ade80}.hle{color:#fb923c}
  .cell.hint{font-size:calc(var(--cell)*.34)}
  .cell.open.hint{text-shadow:0 0 10px currentColor}
  .cell.liar{background:#4a1d2e!important}
  #board.torus{padding:6px;border-radius:14px;box-shadow:0 0 0 2px #22d3ee88,0 0 24px #22d3ee44;animation:torusglow 3s ease-in-out infinite}
  @keyframes torusglow{50%{box-shadow:0 0 0 2px #a78bfa99,0 0 30px #a78bfa55}}
  #board.tri .cell{font-size:calc(var(--cell)*.42)}
  #board.tri .cell.long{font-size:calc(var(--cell)*.34)}
  #board.tri .stack.s2{font-size:calc(var(--cell)*.3)}
  #board.tri .stack.s3{font-size:calc(var(--cell)*.26);width:calc(var(--cell)*.7)}
  #toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:9;background:#0f172af0;border:1px solid var(--stroke);
    padding:10px 18px;border-radius:12px;font-size:14px;transition:.3s;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #tut{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#020617cc;backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:.3s;padding:16px}
  #tut.show{opacity:1;pointer-events:auto}
  .tutbox{position:relative;width:480px;max-width:100%;max-height:92vh;overflow:auto;background:linear-gradient(160deg,#1e1b4bf5,#0f172af5);
    border:1px solid var(--stroke);border-radius:24px;padding:24px;transform:scale(.85) translateY(30px);transition:.4s cubic-bezier(.2,1.3,.4,1)}
  #tut.show .tutbox{transform:none}
  .tutbox h2{margin:0 0 14px;text-align:center}
  .tutbox .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:10px;border:1px solid var(--stroke);background:var(--glass);color:var(--text);cursor:pointer}
  .tutbox ul{margin:14px 0;padding-left:20px;line-height:1.5;font-size:14px;color:#cbd5e1}
  .tutbox li{margin-bottom:6px}
  .tutbox .play{margin:6px auto 0;display:block;padding:11px 36px;font-size:15px}
  .demo{--cell:42px;background:#0005;border-radius:16px;padding:16px 10px 10px;min-height:190px}
  .dgrid{display:grid;gap:3px;width:max-content;margin:0 auto}
  .demo .cell{cursor:default}
  .demo .cell:hover{transform:none;filter:none}
  .dcap{margin-top:12px;text-align:center;font-size:13px;line-height:1.4;min-height:38px;color:var(--text);animation:capin .4s}
  @keyframes capin{from{opacity:0;transform:translateY(6px)}}
  .ptr{position:absolute;right:-6px;bottom:-12px;font-size:22px;font-style:normal;z-index:5;pointer-events:none;animation:tap .8s ease-in-out infinite}
  @keyframes tap{50%{transform:translate(-4px,-6px) scale(.9)}}
  .scanring{position:absolute;inset:0;border-radius:8px;background:#22d3ee33;box-shadow:inset 0 0 0 2px #22d3ee;animation:ringp 1s ease-in-out infinite;pointer-events:none}
  .cell.hl::after{content:"";position:absolute;inset:-3px;border:2px solid #fde047;border-radius:10px;animation:ringp 1s ease-in-out infinite;pointer-events:none}
  @keyframes ringp{50%{opacity:.35;transform:scale(1.06)}}
  .dsvgw{width:min(300px,100%);margin:0 auto;border-radius:12px}
  .dsvgw.torus{box-shadow:0 0 0 2px #22d3ee88,0 0 22px #22d3ee44}
  .dsvg{display:block;width:100%}
  .dsvg polygon{fill:#4c4f8f;transition:fill .3s}
  .dsvg polygon.nb{fill:#22d3ee}
  .dsvg polygon.sel{fill:#fde047}
  #sound{position:fixed;top:12px;right:12px;z-index:7;width:44px;height:44px;border-radius:14px;font-size:20px;cursor:pointer;
    border:1px solid var(--stroke);background:var(--glass);backdrop-filter:blur(10px);color:var(--text);transition:.2s}
  #sound:hover{transform:scale(1.1) rotate(-6deg)}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:6}
  @media(max-width:520px){.stat{min-width:70px;font-size:18px}.screen{padding:14px}#menu h1{font-size:26px}}
</style>
</head>
<body>
<button id="sound" title="Som">🔊</button>
<div class="blob b1"></div><div class="blob b2"></div>

<!-- MENU INICIAL -->
<div class="screen active" id="menu">
  <h1>💣 CAMPO MINADO</h1>
  <p class="sub">Escolha um modo de jogo e a dificuldade</p>
  <div class="label labelrow">Modo
    <label class="mixsw"><input type="checkbox" id="mixBox"><span class="sw"></span> Mix <span class="qm" data-tut="mix" title="Como funciona">?</span></label></div>
  <div id="mixHint"></div>
  <div class="modes" id="modes"></div>
  <div class="label">Piso</div>
  <div class="levels" id="floors"></div>
  <div class="label">Dificuldade</div>
  <div class="levels" id="levels"></div>
  <button class="play" id="play">JOGAR ▶</button>
</div>

<!-- JOGO -->
<div class="screen" id="game">
  <div class="top">
    <button class="tool" id="menuBtn">← Menu</button>
    <div class="tag" id="tag"></div>
  </div>
  <div class="hud">
    <div class="stat" title="Minas restantes"><span>🚩</span><b id="mines">010</b></div>
    <button id="face" title="Reiniciar">🙂</button>
    <div class="stat"><span>⏱</span><b id="time">000</b></div>
  </div>
  <div class="duelbar" id="duel" hidden>
    <div class="pl" id="p0"><span>🔵 Jogador 1</span><b id="sc0">0</b></div>
    <div class="pl" id="p1"><span>🟠 Jogador 2</span><b id="sc1">0</b></div>
  </div>
  <div class="boardwrap"><div id="board"></div></div>
  <div class="foot">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="tool" id="flagMode">🚩 Modo bandeira</button>
      <button class="tool" id="radarBtn" hidden>📡 Radar</button>
    </div>
    <div>Recorde: <span class="best" id="best">—</span></div>
  </div>
  <div class="foot" id="help"></div>
</div>

<div id="overlay"><div class="modal"><div class="big" id="mEmoji"></div><h2 id="mTitle"></h2><p id="mText"></p>
  <div class="row"><button id="again">Jogar de novo</button><button id="toMenu" class="alt">Menu</button></div></div></div>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="tut"><div class="tutbox"><button class="x" id="tutX">✕</button><h2 id="tutT"></h2>
  <div class="demo" id="tutDemo"></div><ul id="tutL"></ul><button class="play" id="tutOk">Entendi</button></div></div>

<script>
const LEVELS={

function ac(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur=.12,type='sine',vol=.12,delay=0,slideTo=0){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,f0,f1,delay=0){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;
  const len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=buf;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);
}

let tutTimer=0;
function paintToken(e,tok){
  const suf=tok.match(/((?:[*^>]|:a|:b)*)$/)[1];tok=tok.slice(0,tok.length-suf.length);
  const cls=['cell'];let html='';
  if(tok===''||tok==='.'){}
  else if(tok==='_')cls.push('open');
  else if(/^-?\d+$/.test(tok)){const v=+tok;cls.push('open','n'+(v===0?0:((Math.abs(v)-1)%8)+1));if(v<0)cls.push('neg');html=tok}
  else if(/^F+$/.test(tok)){cls.push('flagged');html=stackHTML('🚩',tok.length,' flag')}
  else if(/^N+$/.test(tok)){cls.push('negflag');html=stackHTML('🚩',tok.length,' flag neg')}
  else if(/^B+$/.test(tok)){cls.push('open','mine');html=stackHTML('💣',tok.length,'')}
  else if(/^X+$/.test(tok)){cls.push('open','mine','negmine');html=stackHTML('💣',tok.length,'')}
  else if(tok[0]==='~'){const t=tok.slice(1);html=t;cls.push('open','hint',t[0]==='Σ'?'n6':t[0]==='≥'?'hge':t[0]==='≤'?'hle':'hp');if(t.length>=3)cls.push('long')}
  if(suf.includes('*'))cls.push('hl');
  if(suf.includes(':a'))cls.push('op0');if(suf.includes(':b'))cls.push('op1');
  if(suf.includes('^'))html+='<i class="scanring"></i>';
  if(suf.includes('>'))html+='<i class="ptr">👆</i>';
  const cn=cls.join(' ');if(e.className!==cn)e.className=cn;
  if(e._h!==html){e.innerHTML=html;e._h=html}
}
function runGridDemo(box,frames){
  const g=document.createElement('div');g.className='dgrid';g.style.gridTemplateColumns='repeat(5,var(--cell))';
  const els=[];for(let i=0;i<15;i++){const c=document.createElement('div');c.className='cell';g.appendChild(c);els.push(c)}
  const cap=document.createElement('div');cap.className='dcap';
  box.append(g,cap);let f=0;
  (function step(){
    const fm=frames[f];fm.cells.forEach((t,i)=>paintToken(els[i],t));
    cap.textContent=fm.cap;f=(f+1)%frames.length;tutTimer=setTimeout(step,fm.ms||2400);
  })();
}
function floorGeom(kind){
  if(kind==='irr')return voronoi(6,5,32);
  if(kind==='tri')return triangles(6,5,32);
  const cols=6,rows=5,s=32,g=3,polys=[],adjL=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    polys.push([{x:c*s+g/2,y:r*s+g/2},{x:(c+1)*s-g/2,y:r*s+g/2},{x:(c+1)*s-g/2,y:(r+1)*s-g/2},{x:c*s+g/2,y:(r+1)*s-g/2}]);
    const a=[];
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;let x=c+dx,y=r+dy;
      if(kind==='torus'){x=(x+cols)%cols;y=(y+rows)%rows}else if(x<0||y<0||x>=cols||y>=rows)continue;
      a.push(y*cols+x);
    }
    adjL.push(a);
  }
  return{polys,adj:adjL,W:cols*s,H:rows*s};
}
function runFloorDemo(box,kind){
  const G=floorGeom(kind),cols=6,rows=5;
  const svg=document.createElement('div');svg.className='dsvgw'+(kind==='torus'?' torus':'');
  svg.innerHTML=`<svg viewBox="0 0 ${G.W} ${G.H}" class="dsvg">`+
    G.polys.map(p=>`<polygon points="${p.map(v=>v.x.toFixed(1)+','+v.y.toFixed(1)).join(' ')}"/>`).join('')+'</svg>';
  const cap=document.createElement('div');cap.className='dcap';box.append(svg,cap);
  const polys=[...svg.querySelectorAll('polygon')];
  let focus;
  if(kind==='square')focus=[2*cols+3];
  else if(kind==='torus')focus=[0,cols*rows-1,cols-1,(rows-1)*cols];
  else{ // casas mais próximas do centro, com o maior número de vizinhas
    const cx=G.W/2,cy=G.H/2;
    focus=G.polys.map((p,i)=>({i,d:Math.hypot(p.reduce((s,v)=>s+v.x,0)/p.length-cx,p.reduce((s,v)=>s+v.y,0)/p.length-cy)}))
      .sort((a,b)=>a.d-b.d).slice(0,5).map(o=>o.i);
  }
  let f=0;
  (function step(){
    polys.forEach(p=>p.removeAttribute('class'));

/* piso irregular: diagrama de Voronoi com pontos sorteados */
function clip(poly,nx,ny,c,tag){
  const out=[],n=poly.length;
  for(let i=0;i<n;i++){
    const A=poly[i],B=poly[(i+1)%n],da=nx*A.x+ny*A.y-c,db=nx*B.x+ny*B.y-c;
    const I=()=>{const k=da/(da-db);return{x:A.x+(B.x-A.x)*k,y:A.y+(B.y-A.y)*k}};
    if(da<=0){out.push({x:A.x,y:A.y,t:A.t});if(db>0){const p=I();out.push({x:p.x,y:p.y,t:tag})}}
    else if(db<=0){const p=I();out.push({x:p.x,y:p.y,t:A.t})}
  }
  return out;
}
function voronoi(gc,gr,s){
  const W=gc*s,H=gr*s,g=Math.max(3,s*.09),raw=[];
  for(let j=0;j<gr;j++)for(let i=0;i<gc;i++)raw.push([(i+.5+(Math.random()-.5)*.84)*s,(j+.5+(Math.random()-.5)*.84)*s]);
  const sets=raw.map(()=>new Set()),polys=[];
  raw.forEach((p,k)=>{
    const ci=k%gc,cj=k/gc|0;
    let poly=[[g/2,g/2],[W-g/2,g/2],[W-g/2,H-g/2],[g/2,H-g/2]].map(([x,y])=>({x,y,t:-1}));
    for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){
      const i=ci+di,j=cj+dj;if((!di&&!dj)||i<0||j<0||i>=gc||j>=gr)continue;
      const m=j*gc+i,q=raw[m],dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy),nx=dx/len,ny=dy/len;
      poly=clip(poly,nx,ny,nx*(p[0]+q[0])/2+ny*(p[1]+q[1])/2-g/2,m);
    }
    polys.push(poly);
    poly.forEach((v,i)=>{const w=poly[(i+1)%poly.length];
      if(v.t>=0&&Math.hypot(w.x-v.x,w.y-v.y)>2){sets[k].add(v.t);sets[v.t].add(k)}});
  });
  return{polys,adj:sets.map(a=>[...a]),W,H};
}
/* piso triangular: triângulos equiláteros; vizinhos = quem divide ao menos um vértice (12) */
function triangles(gc,gr,s){
  const a=s*1.52,half=a/2,h=a*.866,g=Math.max(3,s*.09);
  const tc=Math.max(4,Math.floor(2*gc*s/a)-1),rows=Math.max(3,Math.floor(gr*s/h));
  const ri=a/(2*Math.sqrt(3)),f=(ri-g/2)/ri;
  const polys=[],vmap=new Map();
  for(let r=0;r<rows;r++)for(let c=0;c<tc;c++){
    const up=(r+c)%2===0,v=up?[[c,r+1],[c+2,r+1],[c+1,r]]:[[c,r],[c+2,r],[c+1,r+1]],k=polys.length;
    v.forEach(([i,j])=>{const key=i+','+j;if(!vmap.has(key))vmap.set(key,[]);vmap.get(key).push(k)});
    const p=v.map(([i,j])=>({x:i*half,y:j*h})),cx=(p[0].x+p[1].x+p[2].x)/3,cy=(p[0].y+p[1].y+p[2].y)/3;
    polys.push(p.map(q=>({x:cx+(q.x-cx)*f,y:cy+(q.y-cy)*f})));
  }
  const sets=polys.map(()=>new Set());
  vmap.forEach(l=>l.forEach(a=>l.forEach(b=>{if(a!==b)sets[a].add(b)})));
  return{polys,adj:sets.map(x=>[...x]),W:(tc+1)*half,H:rows*h};
}
function mountPolys(G,s){
  adj=G.adj;pts=[];grid=[[]];
  G.polys.forEach((poly,k)=>{
    let A=0,cx=0,cy=0;
    poly.forEach((a,i)=>{const b=poly[(i+1)%poly.length],f=a.x*b.y-b.x*a.y;A+=f;cx+=(a.x+b.x)*f;cy+=(a.y+b.y)*f});
    A/=2;cx/=6*A;cy/=6*A;
    const hw=Math.max(...poly.map(v=>Math.abs(v.x-cx)))+1,hh=Math.max(...poly.map(v=>Math.abs(v.y-cy)))+1;
    const el=document.createElement('div');el.className='cell spawn';
    el.style.cssText=`left:${cx-hw}px;top:${cy-hh}px;width:${2*hw}px;height:${2*hh}px;clip-path:polygon(${
      poly.map(v=>`${(v.x-cx+hw).toFixed(1)}px ${(v.y-cy+hh).toFixed(1)}px`).join(',')})`;
    pts.push([cx/s,cy/s]);
    el.style.animationDelay=((cx+cy)/s*18)+'ms';

function neighbors(x,y){
  if(shapes)return adj[x].map(j=>[j,0]);

function place(sx,sy){
  const safe=new Set([sy*C+sx,...neighbors(sx,sy).map(([x,y])=>y*C+x)]);
  const free=[];
  for(let i=0;i<C*R;i++)if(!safe.has(i))free.push(i);
  free.sort(()=>Math.random()-.5);
  plan.forEach((v,i)=>{const k=free[i];grid[k/C|0][k%C].m=v});
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const nb=neighbors(x,y),g=grid[y][x];
    g.n=nb.reduce((s,[a,b])=>s+grid[b][a].m,0);
    g.a=nb.filter(([a,b])=>grid[b][a].m!==0).length;
    g.dn=g.n;g.liar=false;g.h=null;
  }

}
/* números mentirosos e dicas parciais (valores mostrados ≠ valores reais) */

  if(has('partial'))all.forEach(g=>{
    if(g.a===0)return;const v=g.dn,t=Math.random(),r=Math.random()<.5?0:1;
    if(t<.34||(t<.67&&v-r<1&&!has('negative')))g.h={k:'p',txt:(((v%2)+2)%2===0?'par':'ímp')};

function reveal(x,y){

    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.15,life:1,d:.02,sz:2+Math.random()*4,c:colors[i%colors.length]})}loop()}
function confetti(){const cols=['#8b5cf6','#22d3ee','#f472b6','#fde047','#4ade80'];

  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=p.d;
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    p.rot?ctx.fillRect(p.x,p.y,p.sz,p.sz*.6):(ctx.beginPath(),ctx.arc(p.x,p.y,p.sz,0,6.28),ctx.fill())}
  raf=parts.length?requestAnimationFrame(f):0;if(!raf)ctx.clearRect(0,0,cv.width,cv.height)})}

/* ---------- UI ---------- */
function restart(){SFX.click();$('#overlay').classList.remove('show');init()}
faceEl.onclick=restart;$('#again').onclick=restart;
$('#flagMode').onclick=e=>{flagMode=!flagMode;e.currentTarget.classList.toggle('on',flagMode)};
addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&$('#game').classList.contains('active'))restart()});
renderModes();
</script>
