<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Campo Minado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe8d6; --paper2:#e2d9c0; --card:#fffaf0; --ink:#1b1b1b; --muted:#5f5b4e;
    --yellow:#f2b632; --red:#e4572e; --blue:#3a6ea5; --green:#4c9f70; --teal:#2a9d8f;
    --sans:"Space Grotesk","Trebuchet MS",system-ui,sans-serif; --mono:"Space Mono","Courier New",monospace;
    --cell:36px;
    --hard:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--sans);color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(#1b1b1b22 1.2px,transparent 1.4px);background-size:22px 22px;
    display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden;user-select:none;
  }
  button{font-family:inherit;color:inherit}

  .screen{display:none;position:relative;z-index:1;max-width:100%;
    background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:22px;box-shadow:8px 8px 0 var(--ink)}
  .screen.active{display:block;animation:appIn .45s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes appIn{from{opacity:0;transform:translateY(24px) rotate(-.6deg)}}
  h1{margin:0 0 14px;font-size:22px;letter-spacing:1px;text-align:center;text-transform:uppercase;font-weight:700}

  /* ---------- menu ---------- */
  #menu{width:700px;text-align:center}
  #menu h1{font-size:44px;line-height:1;margin-bottom:6px;letter-spacing:-1px;transform:rotate(-1.5deg);
    text-shadow:3px 3px 0 var(--yellow)}
  #menu .sub{color:var(--muted);margin:0 0 18px;font-size:15px}
  .label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ink);font-weight:700;margin:18px 0 10px;
    display:flex;align-items:center;gap:10px}
  .label::before,.label::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.25}
  .mixbar{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    border:3px dashed var(--ink);border-radius:12px;padding:12px 16px;background:var(--paper);transition:.15s}
  .mixbar:hover{background:var(--paper2)}
  .mixbar.on{border-style:solid;background:var(--yellow);box-shadow:var(--hard)}
  .mixbar input{display:none}
  .mixbar .sw{width:52px;height:28px;border-radius:999px;border:3px solid var(--ink);background:#fff;position:relative;flex:none;transition:.2s}
  .mixbar .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:.2s}
  .mixbar input:checked+.sw{background:var(--green)}
  .mixbar input:checked+.sw::after{transform:translateX(24px)}
  .mixbar .mt{flex:1;line-height:1.25}
  .mixbar .mt b{font-size:17px;display:block;text-transform:uppercase;letter-spacing:.5px}
  .mixbar .mt span{font-size:13px;color:var(--ink);opacity:.75}
  #mixHint{min-height:18px;font-size:13px;font-weight:700;color:var(--red);margin:8px 0 -6px}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:4px}
  .mode{
    text-align:left;border:3px solid var(--ink);background:var(--card);border-radius:12px;padding:14px 14px 14px;
    cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s;position:relative;box-shadow:var(--hard);
    animation:cardIn .45s both cubic-bezier(.2,.9,.3,1.3)}
  .mode:nth-child(2){animation-delay:.05s}.mode:nth-child(3){animation-delay:.1s}.mode:nth-child(4){animation-delay:.15s}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) rotate(1.5deg)}}
  .mode:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .mode:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .mode.sel{background:var(--yellow);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .mode.mixcard{border-style:dashed}
  .mode.mixcard.sel{border-style:solid;background:var(--green);color:#fff}
  .mode.mixcard.sel .d{color:#fff;opacity:.9}
  .mode .ic{font-size:30px;display:inline-block}
  .mode:hover .ic{animation:wiggle .5s}
  @keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  .mode b{display:block;font-size:17px;margin:6px 0 4px}
  .mode .d{font-size:12.5px;line-height:1.4;color:var(--ink);opacity:.75;display:block}
  .levels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .lvl{border:3px solid var(--ink);background:var(--card);padding:9px 16px;border-radius:10px;box-shadow:var(--hard);
    font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
  .lvl small{display:block;font-weight:500;font-size:11px;opacity:.7;margin-top:2px}
  .lvl:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .lvl:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .lvl.sel{background:var(--yellow);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .play{margin-top:26px;border:3px solid var(--ink);padding:14px 52px;border-radius:12px;font-weight:700;font-size:20px;letter-spacing:2px;
    color:#fff;background:var(--red);cursor:pointer;box-shadow:6px 6px 0 var(--ink);transition:transform .12s,box-shadow .12s;text-transform:uppercase}
  .play:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
  .play:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--ink)}

  .qm{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;line-height:1;
    background:#fff;border:2px solid var(--ink);color:var(--ink);cursor:help;transition:.15s;flex:none}
  .qm:hover{background:var(--blue);color:#fff;transform:scale(1.2) rotate(8deg)}
  .mode .qm{position:absolute;top:10px;right:10px;z-index:2}
  .lvl .qm{margin-left:8px;vertical-align:middle}
  .mode.mixing::before{content:"";position:absolute;top:12px;left:12px;width:20px;height:20px;border:3px solid var(--ink);border-radius:5px;background:#fff}
  .mode.mixing.sel::before{background:var(--green);content:"✓";color:#fff;font-weight:700;font-size:14px;line-height:14px;text-align:center}
  .mode.mixing .ic{margin-left:28px}

  /* ---------- jogo ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .tag{font-weight:700;font-size:14px;padding:6px 12px;border-radius:8px;background:var(--yellow);border:3px solid var(--ink)}
  .tool{border:3px solid var(--ink);background:var(--card);padding:7px 13px;border-radius:9px;box-shadow:var(--hard);
    font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .tool:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .tool:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .tool.on{background:var(--red);color:#fff}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .stat{min-width:96px;padding:6px 12px;border-radius:9px;background:var(--ink);border:3px solid var(--ink);
    font:700 24px/1.1 var(--mono);color:#ff6b4a;text-align:center;letter-spacing:2px}
  .stat span{font-size:16px;margin-right:4px}
  #face{width:54px;height:54px;border-radius:12px;font-size:28px;border:3px solid var(--ink);background:var(--yellow);box-shadow:var(--hard);cursor:pointer;transition:transform .12s,box-shadow .12s}
  #face:hover{transform:translate(-1px,-1px) rotate(-6deg);box-shadow:4px 4px 0 var(--ink)}
  #face:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .boardwrap{overflow:auto;max-width:calc(100vw - 80px);max-height:62vh;padding:8px;border-radius:10px;background:var(--paper2);border:3px solid var(--ink)}
  #board{display:grid;gap:3px;width:max-content;margin:0 auto;position:relative}
  .cell{
    width:var(--cell);height:var(--cell);border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:700;font-size:calc(var(--cell)*.52);cursor:pointer;position:relative;color:var(--ink);
    background:#c9bd96;border:2px solid var(--ink);box-shadow:inset 0 -4px 0 #00000026,inset 0 3px 0 #ffffff55;
    transition:transform .1s,filter .1s;
  }
  .cell.long{font-size:calc(var(--cell)*.4)}
  .cell.spawn{animation:spawn .4s both cubic-bezier(.2,.9,.3,1.4)}
  @keyframes spawn{from{opacity:0;transform:scale(.3) rotate(-20deg)}}
  .cell:not(.open):hover{filter:brightness(1.12);transform:translateY(-2px)}
  .cell:not(.open):active{transform:translateY(1px) scale(.94)}
  .cell.open{background:var(--card);box-shadow:none;border-color:#1b1b1b55;cursor:default;animation:reveal .3s both}
  @keyframes reveal{0%{transform:scale(.6) rotate(-8deg);background:var(--yellow)}60%{transform:scale(1.08)}100%{transform:none}}
  .n0{color:#6b6a8a}
  .n1{color:#1d4ed8}.n2{color:#15803d}.n3{color:#dc2626}.n4{color:#6d28d9}
  .n5{color:#c2410c}.n6{color:#0e7490}.n7{color:#be185d}.n8{color:#111}
  .cell.open.neg{background:#d8e7f7;border-color:var(--blue)}
  .flag{animation:flagpop .35s cubic-bezier(.2,1.6,.4,1) backwards;display:inline-block}
  .flag.neg{filter:hue-rotate(180deg) saturate(1.3)}
  @keyframes flagpop{from{transform:scale(0) translateY(-14px) rotate(-40deg)}}
  .stack{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;line-height:1.05;pointer-events:none}
  .stack.s2{font-size:calc(var(--cell)*.4)}
  .stack.s3{font-size:calc(var(--cell)*.34);width:calc(var(--cell)*.92)}
  #board.shapes .stack.s2{font-size:calc(var(--cell)*.34)}
  #board.shapes .stack.s3{font-size:calc(var(--cell)*.3);width:calc(var(--cell)*.82)}
  .badge{position:absolute;right:1px;bottom:0;font-family:var(--mono);font-weight:700;font-size:calc(var(--cell)*.3);line-height:1;font-style:normal;
    background:var(--ink);color:#fff;border-radius:4px;padding:2px 3px;animation:flagpop .3s}
  .badge.neg{color:#8ec5ff}
  .cell.flagged{background:#f08a6a}
  .cell.negflag{background:#8fb7e3}
  .cell.mine{background:#cfc6a8;animation:boom .45s both}
  .cell.negmine{background:#b9d3f0}
  .cell.negmine .stack>span{filter:invert(1)}
  .cell.boom{background:var(--red)!important;z-index:2}
  @keyframes boom{0%{transform:scale(.5)}50%{transform:scale(1.35)}100%{transform:none}}
  .cell.wrong{background:#e8b4a6}
  .cell.wrong::after{content:"✖";position:absolute;color:var(--red);font-size:16px;right:2px;top:-2px}
  #board.shapes{display:block;position:relative;background:var(--ink);border-radius:8px}
  #board.shapes .cell{position:absolute;border:0;border-radius:0;box-shadow:none}
  #board.shapes .cell:not(.open):hover{transform:scale(1.05);z-index:3}
  #board.shapes .cell.open{background:var(--card)}
  #board.shapes .cell.open.neg{background:#cfe1f5}
  #board.shapes .cell.negmine{background:#b9d3f0}
  #board.shapes .cell.mine:not(.negmine){background:#cfc6a8}
  #board.shapes .cell.flagged{background:#f08a6a}
  #board.shapes .cell.negflag{background:#8fb7e3}
  #board.shapes .cell.boom{z-index:4}
  #board.shapes .badge{right:auto;bottom:auto;left:calc(50% + var(--cell)*.1);top:calc(50% + var(--cell)*.08)}
  #board.shapes .cell.wrong::after{right:auto;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px}
  #board.shake{animation:shake .5s}
  @keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,-2px)}}
  #board.win .cell{animation:wave .8s both}
  @keyframes wave{50%{transform:translateY(-10px) scale(1.12);filter:brightness(1.1)}}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;font-size:13px;color:var(--muted)}
  .best{font-weight:700;color:var(--ink)}
  #help{justify-content:center;text-align:center;line-height:1.5}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1b1b1b99;
    z-index:5;opacity:0;pointer-events:none;transition:.3s}
  #overlay.show{opacity:1;pointer-events:auto}
  .modal{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:28px 38px;text-align:center;box-shadow:8px 8px 0 var(--ink);
    transform:scale(.6) rotate(-3deg);transition:.45s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
  #overlay.show .modal{transform:none}
  .modal .big{font-size:56px;animation:bounce 1s infinite}
  @keyframes bounce{50%{transform:translateY(-10px)}}
  .modal h2{margin:6px 0;text-transform:uppercase}.modal p{color:var(--muted);margin:4px 0 18px}
  .modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .modal button{border:3px solid var(--ink);padding:11px 22px;border-radius:10px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;
    background:var(--red);box-shadow:var(--hard);transition:transform .12s,box-shadow .12s}
  .modal button.alt{background:var(--card);color:var(--ink)}
  .modal button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .modal button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .duelbar{display:flex;gap:10px;margin-bottom:12px}
  .duelbar[hidden]{display:none}
  .duelbar .pl{flex:1;display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-radius:9px;background:var(--card);
    border:3px solid var(--ink);font-weight:700;font-size:13px;opacity:.55;transition:.2s}
  .duelbar .pl b{font:700 20px var(--mono)}
  .duelbar .pl.on{opacity:1;box-shadow:var(--hard);transform:translate(-1px,-1px)}
  #p0.on{background:#8fb7e3}
  #p1.on{background:#f5b78a}
  #game.duel[data-turn="0"] .boardwrap{border-color:var(--blue)}
  #game.duel[data-turn="1"] .boardwrap{border-color:#e07a2f}
  #board .cell.open.op0{background:#cfe0f5}
  #board .cell.open.op1{background:#fbd9c3}
  .tool[hidden]{display:none}
  .tool:disabled{opacity:.4;cursor:not-allowed}
  #board.radar .cell{cursor:crosshair}
  .cell.scan::after{content:"";position:absolute;inset:0;background:var(--teal);opacity:0;pointer-events:none;animation:scanflash .9s var(--sd,0ms) both}
  @keyframes scanflash{0%{opacity:0}30%{opacity:.6}100%{opacity:0}}
  .rmark{position:absolute;z-index:6;transform:translate(-50%,-50%);background:var(--teal);color:#fff;font:700 11px/1 var(--mono);padding:3px 6px;border-radius:6px;
    border:2px solid var(--ink);pointer-events:none;animation:flagpop .4s;white-space:nowrap}
  .rmark.neg{background:var(--blue)}
  .hp{color:#6d28d9}.hge{color:#15803d}.hle{color:#c2410c}
  .cell.hint{font-size:calc(var(--cell)*.34)}
  .cell.liar{background:#f1b4b4!important}
  #board.torus{padding:6px;outline:3px dashed var(--teal);outline-offset:3px;border-radius:6px}
  #board.tri .cell{font-size:calc(var(--cell)*.42)}
  #board.tri .cell.long{font-size:calc(var(--cell)*.34)}
  #board.tri .stack.s2{font-size:calc(var(--cell)*.3)}
  #board.tri .stack.s3{font-size:calc(var(--cell)*.26);width:calc(var(--cell)*.7)}
  #toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:9;background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;transition:.3s;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #tut{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#1b1b1bb3;
    opacity:0;pointer-events:none;transition:.25s;padding:16px}
  #tut.show{opacity:1;pointer-events:auto}
  .tutbox{position:relative;width:490px;max-width:100%;max-height:92vh;overflow:auto;background:var(--card);
    border:3px solid var(--ink);border-radius:14px;padding:24px;box-shadow:8px 8px 0 var(--ink);transform:scale(.85) rotate(-2deg);transition:.4s cubic-bezier(.2,1.3,.4,1)}
  #tut.show .tutbox{transform:none}
  .tutbox h2{margin:0 0 14px;text-align:center;text-transform:uppercase}
  .tutbox .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;border:3px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer}
  .tutbox .x:hover{background:var(--red);color:#fff}
  .tutbox ul{margin:14px 0;padding-left:20px;line-height:1.5;font-size:14px}
  .tutbox li{margin-bottom:6px}
  .tutbox .play{margin:6px auto 0;display:block;padding:10px 36px;font-size:16px}
  .demo{--cell:42px;background:var(--paper2);border:3px solid var(--ink);border-radius:10px;padding:16px 10px 10px;min-height:190px}
  .dgrid{display:grid;gap:3px;width:max-content;margin:0 auto}
  .demo .cell{cursor:default}
  .demo .cell:hover{transform:none;filter:none}
  .dcap{margin-top:12px;text-align:center;font-size:13.5px;font-weight:500;line-height:1.4;min-height:38px;animation:capin .35s}
  @keyframes capin{from{opacity:0;transform:translateY(6px)}}
  .ptr{position:absolute;right:-6px;bottom:-12px;font-size:22px;font-style:normal;z-index:5;pointer-events:none;animation:tap .8s ease-in-out infinite}
  @keyframes tap{50%{transform:translate(-4px,-6px) scale(.9)}}
  .scanring{position:absolute;inset:0;border-radius:4px;background:#2a9d8f44;box-shadow:inset 0 0 0 3px var(--teal);animation:ringp 1s ease-in-out infinite;pointer-events:none}
  .cell.hl::after{content:"";position:absolute;inset:-5px;border:3px solid var(--red);border-radius:9px;animation:ringp 1s ease-in-out infinite;pointer-events:none}
  @keyframes ringp{50%{opacity:.35;transform:scale(1.06)}}
  .dsvgw{width:min(300px,100%);margin:0 auto;border-radius:8px;background:var(--ink)}
  .dsvgw.torus{outline:3px dashed var(--teal);outline-offset:3px}
  .dsvg{display:block;width:100%}
  .dsvg polygon{fill:#c9bd96;transition:fill .3s}
  .dsvg polygon.nb{fill:var(--teal)}
  .dsvg polygon.sel{fill:var(--yellow)}
  #loading{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#1b1b1bb3;
    opacity:0;pointer-events:none;transition:.25s}
  #loading.show{opacity:1;pointer-events:auto}
  .lbox{text-align:center;padding:28px 34px;border-radius:14px;background:var(--card);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);width:370px;max-width:92vw;
    transform:scale(.8) rotate(2deg);transition:.4s cubic-bezier(.2,1.4,.4,1)}
  #loading.show .lbox{transform:none}
  .lbox h3{margin:18px 0 6px;font-size:20px;text-transform:uppercase}
  .lbox p{margin:0 0 14px;color:var(--muted);font-size:14px;min-height:20px}
  .lbox small{display:block;margin-top:12px;color:var(--muted);font-size:12px}
  .spin{position:relative;width:88px;height:88px;margin:0 auto}
  .spin i{position:absolute;inset:0;border-radius:50%;border:5px solid var(--paper2);border-top-color:var(--red);animation:spin 1s linear infinite}
  .spin i:nth-child(2){inset:14px;border-width:4px;border-top-color:var(--ink);animation-duration:1.5s;animation-direction:reverse}
  .spin i:nth-child(3){display:none}
  .spin span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;animation:pulse .8s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{transform:scale(1.25)}}
  .lbar{height:16px;border:3px solid var(--ink);background:#fff;border-radius:8px;overflow:hidden}
  #lFill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,#d99b17 10px 20px);background-size:28px 28px;
    animation:stripes .8s linear infinite;transition:width .25s}
  @keyframes stripes{to{background-position:28px 0}}
  #sound{position:fixed;top:12px;right:12px;z-index:7;width:46px;height:46px;border-radius:10px;font-size:20px;cursor:pointer;
    border:3px solid var(--ink);background:var(--card);box-shadow:var(--hard);transition:transform .12s,box-shadow .12s}
  #sound:hover{transform:translate(-1px,-1px) rotate(-6deg);box-shadow:4px 4px 0 var(--ink)}
  #sound:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:6}
  @media(max-width:520px){.stat{min-width:76px;font-size:19px}.screen{padding:14px}#menu h1{font-size:32px}}
</style>
</head>
<body>

const fmt=n=>(n<0?'-':'')+String(Math.abs(n)).padStart(n<0?2:3,'0');

/* ---------- sons (sintetizados com WebAudio, sem arquivos) ---------- */
let audioCtx=null,muted=false;
try{muted=localStorage.getItem('ms-mute')==='1'}catch(e){}
function ac(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur=.12,type='sine',vol=.12,delay=0,slideTo=0){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,f0,f1,delay=0){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;
  const len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=buf;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);
}

let tutTimer=0;
function paintToken(e,tok){
  const suf=tok.match(/((?:[*^>]|:a|:b)*)$/)[1];tok=tok.slice(0,tok.length-suf.length);
  const cls=['cell'];let html='';
  if(tok===''||tok==='.'){}
  else if(tok==='_')cls.push('open');
  else if(/^-?\d+$/.test(tok)){const v=+tok;cls.push('open','n'+(v===0?0:((Math.abs(v)-1)%8)+1));if(v<0)cls.push('neg');html=tok}
  else if(/^F+$/.test(tok)){cls.push('flagged');html=stackHTML('🚩',tok.length,' flag')}
  else if(/^N+$/.test(tok)){cls.push('negflag');html=stackHTML('🚩',tok.length,' flag neg')}
  else if(/^B+$/.test(tok)){cls.push('open','mine');html=stackHTML('💣',tok.length,'')}
  else if(/^X+$/.test(tok)){cls.push('open','mine','negmine');html=stackHTML('💣',tok.length,'')}
  else if(tok[0]==='~'){const t=tok.slice(1);html=t;cls.push('open','hint',t[0]==='Σ'?'n6':t[0]==='≥'?'hge':t[0]==='≤'?'hle':'hp');if(t.length>=3)cls.push('long')}
  if(suf.includes('*'))cls.push('hl');
  if(suf.includes(':a'))cls.push('op0');if(suf.includes(':b'))cls.push('op1');
  if(suf.includes('^'))html+='<i class="scanring"></i>';
  if(suf.includes('>'))html+='<i class="ptr">👆</i>';
  const cn=cls.join(' ');if(e.className!==cn)e.className=cn;
  if(e._h!==html){e.innerHTML=html;e._h=html}
}

/* piso irregular: diagrama de Voronoi com pontos sorteados */
function clip(poly,nx,ny,c,tag){
  const out=[],n=poly.length;
  for(let i=0;i<n;i++){
    const A=poly[i],B=poly[(i+1)%n],da=nx*A.x+ny*A.y-c,db=nx*B.x+ny*B.y-c;
    const I=()=>{const k=da/(da-db);return{x:A.x+(B.x-A.x)*k,y:A.y+(B.y-A.y)*k}};
    if(da<=0){out.push({x:A.x,y:A.y,t:A.t});if(db>0){const p=I();out.push({x:p.x,y:p.y,t:tag})}}
    else if(db<=0){const p=I();out.push({x:p.x,y:p.y,t:A.t})}
  }
  return out;
}
function voronoi(gc,gr,s){
  const W=gc*s,H=gr*s,g=Math.max(3,s*.09),raw=[];
  for(let j=0;j<gr;j++)for(let i=0;i<gc;i++)raw.push([(i+.5+(Math.random()-.5)*.84)*s,(j+.5+(Math.random()-.5)*.84)*s]);
  const sets=raw.map(()=>new Set()),polys=[];
  raw.forEach((p,k)=>{
    const ci=k%gc,cj=k/gc|0;
    let poly=[[g/2,g/2],[W-g/2,g/2],[W-g/2,H-g/2],[g/2,H-g/2]].map(([x,y])=>({x,y,t:-1}));
    for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){
      const i=ci+di,j=cj+dj;if((!di&&!dj)||i<0||j<0||i>=gc||j>=gr)continue;
      const m=j*gc+i,q=raw[m],dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy),nx=dx/len,ny=dy/len;
      poly=clip(poly,nx,ny,nx*(p[0]+q[0])/2+ny*(p[1]+q[1])/2-g/2,m);
    }
    polys.push(poly);
    poly.forEach((v,i)=>{const w=poly[(i+1)%poly.length];
      if(v.t>=0&&Math.hypot(w.x-v.x,w.y-v.y)>2){sets[k].add(v.t);sets[v.t].add(k)}});
  });
  return{polys,adj:sets.map(a=>[...a]),W,H};
}
/* piso triangular: triângulos equiláteros; vizinhos = quem divide ao menos um vértice (12) */
function triangles(gc,gr,s){
  const a=s*1.52,half=a/2,h=a*.866,g=Math.max(3,s*.09);
  const tc=Math.max(4,Math.floor(2*gc*s/a)-1),rows=Math.max(3,Math.floor(gr*s/h));
  const ri=a/(2*Math.sqrt(3)),f=(ri-g/2)/ri;
  const polys=[],vmap=new Map();
  for(let r=0;r<rows;r++)for(let c=0;c<tc;c++){
    const up=(r+c)%2===0,v=up?[[c,r+1],[c+2,r+1],[c+1,r]]:[[c,r],[c+2,r],[c+1,r+1]],k=polys.length;
    v.forEach(([i,j])=>{const key=i+','+j;if(!vmap.has(key))vmap.set(key,[]);vmap.get(key).push(k)});
    const p=v.map(([i,j])=>({x:i*half,y:j*h})),cx=(p[0].x+p[1].x+p[2].x)/3,cy=(p[0].y+p[1].y+p[2].y)/3;
    polys.push(p.map(q=>({x:cx+(q.x-cx)*f,y:cy+(q.y-cy)*f})));
  }
  const sets=polys.map(()=>new Set());
  vmap.forEach(l=>l.forEach(a=>l.forEach(b=>{if(a!==b)sets[a].add(b)})));
  return{polys,adj:sets.map(x=>[...x]),W:(tc+1)*half,H:rows*h};
}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function makeLayout(s){

/* Resolve por lógica pura (propagação de intervalos + subtração de restrições), sem chutar.
   Devolve a fração das casas seguras que um jogador consegue abrir sozinho a partir do 1º clique. */
function analyze(mv,start){
  const N=mv.length,dmin=has('negative')?(has('multi')?-3:-1):0,dmax=has('multi')?3:1;
  const n=new Int16Array(N),a=new Uint8Array(N);
  for(let i=0;i<N;i++)for(const j of nbr[i]){n[i]+=mv[j];if(mv[j]!==0)a[i]++}
  const lo=new Int8Array(N).fill(dmin),hi=new Int8Array(N).fill(dmax),opened=new Uint8Array(N),pend=new Uint8Array(N);
  let safeTotal=0;for(let i=0;i<N;i++)if(mv[i]===0)safeTotal++;
  const cons=[],varCons=Array.from({length:N},()=>[]),queue=[],toOpen=[],seen=new Set();
  let cnt=0,bad=false;
  const enq=k=>{const c=cons[k];if(!c.q){c.q=true;queue.push(k)}};
  const addCons=(vars,T)=>{const k=cons.length;cons.push({v:vars,T,q:false});for(const j of vars)varCons[j].push(k);enq(k)};
  function open(i){
    const st=[i];
    while(st.length){
      const c=st.pop();if(opened[c])continue;
      if(mv[c]!==0){bad=true;continue}
      opened[c]=1;lo[c]=hi[c]=0;cnt++;
      if(a[c]===0){for(const j of nbr[c])if(!opened[j])st.push(j)}
      else addCons(nbr[c].filter(j=>!opened[j]),n[c]);
      for(const k of varCons[c])enq(k);
    }
  }
  function propagate(){
    while(queue.length){
      const k=queue.pop(),c=cons[k];c.q=false;
      for(let guard=0;guard<40;guard++){
        let sl=0,sh=0;for(const j of c.v){sl+=lo[j];sh+=hi[j]}
        if(c.T<sl||c.T>sh)break;
        let ch=false;
        for(const j of c.v){
          const nl=Math.max(lo[j],c.T-(sh-hi[j])),nh=Math.min(hi[j],c.T-(sl-lo[j]));
          if(nl!==lo[j]||nh!==hi[j]){
            lo[j]=nl;hi[j]=nh;ch=true;
            if(nl===0&&nh===0&&!opened[j]&&!pend[j]){pend[j]=1;toOpen.push(j)}
            for(const q of varCons[j])if(q!==k)enq(q);
          }
        }
        if(!ch)break;
      }
    }
  }
  function derive(){ // se A ⊂ B, então (B − A) tem soma T_B − T_A
    const norm=[],byVar=new Map();
    for(const c of cons){
      const u=[];let T=c.T;
      for(const j of c.v){if(lo[j]===hi[j])T-=lo[j];else u.push(j)}
      if(!u.length)continue;
      const o={u,T,set:new Set(u)},id=norm.length;norm.push(o);
      for(const j of u){let l=byVar.get(j);if(!l)byVar.set(j,l=[]);l.push(id)}
    }
    let added=0;
    for(const A of norm){
      if(A.u.length>12||cons.length>9000)continue;
      for(const id of byVar.get(A.u[0])){
        const B=norm[id];if(B===A||B.u.length<=A.u.length)continue;
        let sub=true;for(const j of A.u)if(!B.set.has(j)){sub=false;break}
        if(!sub)continue;
        const d=B.u.filter(j=>!A.set.has(j)),key=d.join(',')+':'+(B.T-A.T);
        if(seen.has(key))continue;seen.add(key);addCons(d,B.T-A.T);added++;
      }
    }
    return added>0;
  }
  open(start);const flood=cnt;
  for(let rounds=0;rounds<60&&!bad;rounds++){
    propagate();
    if(toOpen.length){while(toOpen.length)open(toOpen.pop());continue}
    if(!derive())break;
  }
  return{frac:bad?0:cnt/safeTotal,extra:cnt-flood,bad};
}

/* sorteia vários tabuleiros e fica com um que dá para resolver por lógica depois do 1º clique */
async function startBoard(sx,sy){
  const id=genId,s=sy*C+sx;
  const thr={easy:1,medium:1,hard:.92,insane:.8}[level],budget={easy:1500,medium:2400,hard:3200,insane:3800}[level];
  showLoading();setLoading(0,0,thr,0);
  const t0=performance.now();let best=null,tries=0;
  for(;;){
    const m=makeLayout(s),r=analyze(m,s);tries++;
    if(!best||r.frac>best.r.frac)best={m,r};
    const el=performance.now()-t0;
    setLoading(tries,best.r.frac,thr,Math.max(best.r.frac/thr,el/budget));
    if(best.r.frac>=thr||(el>budget&&best.r.extra>0)||el>budget*2)break;
    await tick();if(id!==genId)return false;
  }
  setLoading(tries,best.r.frac,thr,1);
  const wait=700-(performance.now()-t0);if(wait>0)await sleep(wait);
  if(id!==genId)return false;
  placeLayout(best.m);hideLoading();return true;
}

  if(over)return;
  const gain=opened-before;
  if(has('duel')&&gain>0){scores[turn]+=gain;updateDuel()}
  if(pendingWin){pendingWin=false;return win()}
  if(has('duel')&&gain>0)passTurn();
}
function reveal(x,y){
  if(over)return;const g=grid[y][x];
  if(g.f!==0)return;
  if(g.o){ // abrir vizinhos (chord) — usa o número mostrado
    if(!g.a||has('partial'))return;
    const nb=neighbors(x,y);
    const fl=nb.filter(([a,b])=>grid[b][a].f!==0).length;
    const sum=nb.reduce((s,[a,b])=>s+grid[b][a].f,0);
    if(fl>0&&sum===g.dn){SFX.chord();nb.forEach(([a,b])=>{if(grid[b][a].f===0&&!grid[b][a].o)reveal(a,b)})}
    return;
  }
  if(!started)return;
  if(g.m!==0)return lose(x,y);
  const q=[[x,y,0]],depths=new Set();g.o=true;
  while(q.length){
    const [cx,cy,d]=q.shift();openCell(cx,cy,d);depths.add(d);
    if(grid[cy][cx].a===0)for(const [a,b] of neighbors(cx,cy)){const t=grid[b][a];
      if(!t.o&&t.f===0&&t.m===0){t.o=true;q.push([a,b,d+1])}}
  }
  [...depths].sort((a,b)=>a-b).slice(0,16).forEach(d=>setTimeout(()=>SFX.open(d),d*35));
  if(opened===C*R-countMineCells())pendingWin=true;
}
function countMineCells(){let k=0;for(const row of grid)for(const g of row)if(g.m!==0)k++;return k}
function openCell(x,y,d){
  const g=grid[y][x],e=el(x,y);opened++;
  e.innerHTML='';e.classList.remove('flagged','negflag','spawn');e.classList.add('open');
  e.style.animationDelay=(d*35)+'ms';
  if(g.a>0){
    let t;
    if(g.h){t=g.h.txt;e.classList.add('hint','h'+g.h.k)}
    else{t=String(g.dn);e.classList.add('n'+(g.dn===0?0:((Math.abs(g.dn)-1)%8)+1));if(g.dn<0)e.classList.add('neg')}
    e.textContent=t;if(t.length>=3)e.classList.add('long');
  }
  if(has('duel'))e.classList.add('op'+turn);
}
function mineHTML(m){return stackHTML('💣',Math.abs(m),'')}
function revealLiars(){
  grid.flat().forEach((g,i)=>{if(g.liar&&g.o){const e=cells[i];e.classList.add('liar');e.insertAdjacentHTML('beforeend','<i class="badge">🤥</i>')}});
}
function lose(x,y){
  over=true;clearInterval(timer);faceEl.textContent='😵';setRadarOn(false);
  const loser=turn,mines=[];
  for(let j=0;j<R;j++)for(let i=0;i<C;i++){const g=grid[j][i];
    if(g.m!==0&&g.f!==g.m)mines.push([i,j]);
    else if(g.m===0&&g.f!==0)el(i,j).classList.add('wrong');}
  mines.sort((a,b)=>dist(a,[x,y])-dist(b,[x,y]));
  const step=Math.max(12,Math.min(60,900/mines.length));
  mines.forEach(([i,j],k)=>setTimeout(()=>{
    const e=el(i,j),m=grid[j][i].m;
    e.classList.remove('flagged','negflag');e.classList.add('open','mine');
    if(m<0)e.classList.add('negmine');
    e.innerHTML=mineHTML(m);
    if(i===x&&j===y){e.classList.add('boom');boardEl.classList.add('shake');burst(e,40,['#ef4444','#f97316','#fde047']);SFX.boom()}
    else if(k%4===0){burst(e,10,m<0?['#38bdf8','#818cf8']:['#ef4444','#f97316']);SFX.pop(k)}
  },k*step));
  revealLiars();
  setTimeout(()=>{
    if(has('duel'))modal('💥',`${PN[loser]} explodiu!`,`${PN[1-loser]} vence! Placar: 🔵 ${scores[0]} × ${scores[1]} 🟠`);
    else modal('💥','Boom!','Você pisou numa mina. Tente de novo!');
  },mines.length*step+700);
}
function win(){
  over=true;clearInterval(timer);faceEl.textContent='😎';setRadarOn(false);
  if(has('duel')){ // bônus de bandeiras: certa +2, errada −2
    grid.flat().forEach(g=>{if(g.f!==0)scores[g.fo||0]+=(g.f===g.m?2:-2)});updateDuel();
  }
  for(let j=0;j<R;j++)for(let i=0;i<C;i++){const g=grid[j][i];
    if(g.m!==0&&g.f!==g.m){g.f=g.m;renderFlag(i,j)}}
  fsum=NET;setCounter();revealLiars();
  cells.forEach((e,k)=>{const q=pos(k%C,k/C|0);e.style.animationDelay=((q[0]+q[1])*40)+'ms'});
  boardEl.classList.add('win');
  let rec='';
  if(!has('duel')){try{const b=+localStorage.getItem(bestKey());
    if(!b||secs<b){localStorage.setItem(bestKey(),secs);rec=' 🏆 Novo recorde!'}}catch(e){}}
  showBest();confetti();SFX.win();
  setTimeout(()=>{
    if(has('duel')){
      const [a,b]=scores;
      modal('🏆',a===b?'Empate!':`${PN[a>b?0:1]} vence!`,`Campo limpo! Placar final (com bandeiras): 🔵 ${a} × ${b} 🟠`);
    }else modal('🎉','Você venceu!',`Tempo: ${secs}s.${rec}`);
  },1200);
}
function modal(e,t,p){$('#mEmoji').textContent=e;$('#mTitle').textContent=t;$('#mText').textContent=p;$('#overlay').classList.add('show')}

/* ---------- duelo ---------- */
function updateDuel(){
  $('#sc0').textContent=scores[0];$('#sc1').textContent=scores[1];
  $('#p0').classList.toggle('on',turn===0);$('#p1').classList.toggle('on',turn===1);
  $('#game').dataset.turn=turn;updateRadar();
}
function passTurn(){turn=1-turn;setRadarOn(false);updateDuel();SFX.turn()}

/* ---------- detector (radar) ---------- */
function updateRadar(){
  const b=$('#radarBtn');b.innerHTML=`📡 Radar (<b>${radar[turn]}</b>)`;
  b.classList.toggle('on',radarOn);b.disabled=radar[turn]<=0&&!radarOn;
}
function setRadarOn(v){radarOn=v;boardEl.classList.toggle('radar',v);updateRadar()}
$('#radarBtn').onclick=()=>{
  if(over)return;
  if(!radarOn&&radar[turn]<=0)return;
  if(!radarOn&&!started){toast('Abra uma casa antes de usar o radar');return}
  SFX.click();setRadarOn(!radarOn);
};
function scan(x,y){
  if(over)return;
  if(!started){setRadarOn(false);toast('Abra uma casa antes de usar o radar');return}
  if(radar[turn]<=0)return;
  radar[turn]--;
  const seen=new Map([[y*C+x,0]]),q=[[x,y]];
  while(q.length){const [cx,cy]=q.shift(),d=seen.get(cy*C+cx);if(d>=2)continue;
    for(const [a,b] of neighbors(cx,cy)){const k=b*C+a;if(!seen.has(k)){seen.set(k,d+1);q.push([a,b])}}}
  let sum=0;
  seen.forEach((d,k)=>{sum+=grid[k/C|0][k%C].m;
    const e=cells[k];e.style.setProperty('--sd',(d*130)+'ms');e.classList.add('scan');setTimeout(()=>e.classList.remove('scan'),1300)});
  const c=cells[y*C+x],m=document.createElement('div');
  m.className='rmark'+(sum<0?' neg':'');m.textContent='📡 '+(sum>0?'+':'')+sum;
  m.style.left=(c.offsetLeft+c.offsetWidth/2)+'px';m.style.top=(c.offsetTop+c.offsetHeight/2)+'px';
  boardEl.appendChild(m);
  SFX.radar();setRadarOn(false);
  if(has('duel'))passTurn();
}

/* ---------- partículas ---------- */
const cv=$('#fx'),ctx=cv.getContext('2d');let parts=[],raf=0;
function resize(){cv.width=innerWidth;cv.height=innerHeight}resize();addEventListener('resize',resize);
function burst(elm,n,colors){const r=elm.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*6;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.15,life:1,d:.02,sz:2+Math.random()*4,c:colors[i%colors.length]})}loop()}
function confetti(){const cols=['#8b5cf6','#22d3ee','#f472b6','#fde047','#4ade80'];
  for(let i=0;i<220;i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*300,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,
    g:.05,life:1,d:.004,sz:5+Math.random()*6,c:cols[i%5],rot:1});loop()}
function loop(){if(raf)return;raf=requestAnimationFrame(function f(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=p.d;
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    p.rot?ctx.fillRect(p.x,p.y,p.sz,p.sz*.6):(ctx.beginPath(),ctx.arc(p.x,p.y,p.sz,0,6.28),ctx.fill())}
  raf=parts.length?requestAnimationFrame(f):0;if(!raf)ctx.clearRect(0,0,cv.width,cv.height)})}

/* ---------- UI ---------- */
function restart(){SFX.click();$('#overlay').classList.remove('show');init()}
faceEl.onclick=restart;$('#again').onclick=restart;
$('#flagMode').onclick=e=>{flagMode=!flagMode;e.currentTarget.classList.toggle('on',flagMode)};
addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&$('#game').classList.contains('active'))restart()});
renderModes();
</script>
